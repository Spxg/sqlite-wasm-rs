[package]
name = "sqlite-wasm-rs"
links = "wsqlite3"
version = "0.6.1"
authors = ["Spxg <noz@live.com>"]
repository = "https://github.com/Spxg/sqlite-wasm-rs"
description = "`wasm32-unknown-unknown` bindings to the libsqlite3 library."
categories = ["development-tools::ffi", "wasm", "database"]
keywords = ["sqlite", "sqlite-wasm", "wasm", "webassembly", "javascript"]
readme.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
include.workspace = true

[dependencies]
rsqlite-vfs = "0.2"
wasm-bindgen = { version = "0.2.128", default-features = false, optional = true }
js-sys = { version = "0.3.105", default-features = false, optional = true }

[features]
# Optional JavaScript host adapter. Otherwise supply link-time host hooks.
wasm-bindgen = ["dep:wasm-bindgen", "dep:js-sys"]
# SQLite3MultipleCiphers
# <https://github.com/utelle/SQLite3MultipleCiphers>
# <https://utelle.github.io/SQLite3MultipleCiphers>
sqlite3mc = ["dep:sqlite3mc-src"]

[build-dependencies]
cc = "1"
bindgen = { version = "0.73", default-features = false, features = ["runtime", "prettyplease"], optional = true }
sqlite3mc-src = { version = "=205.1.0", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.78"

[[test]]
name = "sqlite3"
required-features = ["wasm-bindgen"]

[[test]]
name = "sqlite3mc"
required-features = ["wasm-bindgen", "sqlite3mc"]

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

[workspace]
resolver = "2"
exclude = ["examples/host-js", "examples/host-c"]
members = [
  "crates/rsqlite-vfs",
  "crates/sqlite-wasm-libc",
  "crates/sqlite-wasm-vfs",
  "extensions/sqlite-vec",
  "examples/nodejs",
  "examples/use-prebuild-lib",
]

[workspace.package]
readme = "README.md"
edition = "2021"
license = "MIT"
rust-version = "1.81.0"
include = [
    'src/**/*.rs',
    'examples/*.rs',
    'build.rs',
    'sqlite3/**/*.c',
    'sqlite3/**/*.h',
    'shim/**/*.h',
    'shim/**/*.c',
    'Cargo.toml',
    '/README.md',
    'LICENSE',
]

[patch.crates-io]
rsqlite-vfs = { path = "./crates/rsqlite-vfs" }
sqlite-wasm-rs = { path = "./" }
sqlite-wasm-vfs = { path = "./crates/sqlite-wasm-vfs" }
