[package]
name = "host-c"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the default wasm-bindgen adapter out of this example's dependency graph.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
sqlite-wasm-rs = { path = "../..", default-features = false }

[build-dependencies]
cc = "1"

[features]
sqlite3mc = ["sqlite-wasm-rs/sqlite3mc"]
bindgen = ["sqlite-wasm-rs/bindgen"]

[patch.crates-io]
rsqlite-vfs = { path = "../../crates/rsqlite-vfs" }
