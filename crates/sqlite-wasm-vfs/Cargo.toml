[package]
name = "sqlite-wasm-vfs"
version = "0.2.0"
edition = "2021"
authors = ["Spxg <unsafe@outlook.es>"]
license = "MIT"
repository = "https://github.com/Spxg/sqlite-wasm-rs"
description = "some experimental VFS implementations."
categories = ["development-tools::ffi", "wasm", "database"]
keywords = ["sqlite", "sqlite-wasm", "wasm", "webassembly", "javascript"]

[features]
default = ["sahpool"]
sahpool = [
  "dep:rsqlite-vfs",
  "dep:wasm-bindgen",
  "dep:js-sys",
  "dep:wasm-bindgen-futures",
  "dep:futures-util",
  "dep:thiserror",
  "dep:web-sys",
]

[dependencies]
rsqlite-vfs = { version = "0.1", optional = true }

wasm-bindgen = { version = "0.2.104", optional = true }
js-sys = { version = "0.3.81", optional = true }
wasm-bindgen-futures = { version = "0.4.54", optional = true }
futures-util = { version = "0.3.32", default-features = false, features = ["std"], optional = true }
thiserror = { version = "2.0.12", optional = true }
web-sys = { version = "0.3.81", optional = true, features = [
  "StorageManager",
  "FileSystemSyncAccessHandle",
  "FileSystemDirectoryHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemReadWriteOptions",
  "WorkerGlobalScope",
  "DedicatedWorkerGlobalScope",
  "WorkerNavigator",
  "FileSystemGetFileOptions",
  "FileSystemFileHandle",
]}

[dev-dependencies]
wasm-bindgen-test = "0.3.54"
sqlite-wasm-rs = { version = "0.5.1", default-features = false, features = ["wasm-bindgen"] }

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
