name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test_sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - wasm-bindgen
          - wasm-bindgen,sqlite3mc
          - wasm-bindgen,bindgen
          - wasm-bindgen,bindgen,sqlite3mc
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test unit and integration tests
      run: wasm-pack test --node --features ${{ matrix.features }}
    - name: Test prebuilt libsqlite3.a
      if: matrix.features == 'wasm-bindgen'
      working-directory: examples/use-prebuild-lib
      run: RUSTFLAGS="-L $(pwd)" wasm-pack test --node

  test_diesel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run diesel tests
      run: |
        git clone --depth 1 https://github.com/diesel-rs/diesel.git
        cd diesel
        rustup target add wasm32-unknown-unknown
        printf "[patch.crates-io]\n" >> Cargo.toml
        printf "sqlite-wasm-rs = { path = \"..\" }\n" >> Cargo.toml
        printf "rsqlite-vfs = { path = \"../crates/rsqlite-vfs\" }\n" >> Cargo.toml
        printf "sqlite-wasm-vfs = { path = \"../crates/sqlite-wasm-vfs\" }\n" >> Cargo.toml
        wasm_bindgen_version=$(cargo metadata --format-version 1 --filter-platform wasm32-unknown-unknown --no-default-features --features diesel/sqlite | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | if length == 1 then .[0] else error("expected one wasm-bindgen version") end')
        cargo install wasm-bindgen-cli --version "$wasm_bindgen_version" --locked
        DATABASE_URL=":memory:" cargo xtask run-tests --wasm sqlite --no-example-schema-check -- --no-fail-fast

  test_rusqlite:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Run rusqlite tests
      run: |
        git clone --depth 1 https://github.com/rusqlite/rusqlite.git
        cd rusqlite
        printf "[patch.crates-io]\n" >> Cargo.toml
        printf "sqlite-wasm-rs = { path = \"..\" }\n" >> Cargo.toml
        printf "rsqlite-vfs = { path = \"../crates/rsqlite-vfs\" }\n" >> Cargo.toml
        WASM_BINDGEN_TEST_TIMEOUT=60 wasm-pack test --node --features modern-full,sqlite-wasm-rs/wasm-bindgen

  test_host_examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [host-js, host-c]
    steps:
    - uses: actions/checkout@v4
    - name: Test without wasm-bindgen
      working-directory: examples/${{ matrix.example }}
      run: |
        rustup target add wasm32-unknown-unknown
        for features in "" sqlite3mc bindgen bindgen,sqlite3mc; do
          cargo build --target wasm32-unknown-unknown --features "$features"
          node run.mjs
          cargo tree --target wasm32-unknown-unknown --edges normal --features "$features" > dependencies.txt
          if grep -E 'wasm-bindgen|js-sys' dependencies.txt; then
            exit 1
          fi
        done

  test_style:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: |
        cargo fmt --all --check
        cargo fmt --manifest-path examples/host-js/Cargo.toml --check
        cargo fmt --manifest-path examples/host-c/Cargo.toml --check
    - name: Check clippy
      run: |
        rustup target add wasm32-unknown-unknown
        cargo clippy --no-default-features --target wasm32-unknown-unknown -- -D warnings
        cargo clippy --all-features --target wasm32-unknown-unknown -- -D warnings

  test_atomics:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test shared-memory host adapter
      env:
        CFLAGS_wasm32_unknown_unknown: -matomics
        RUSTFLAGS: >-
          -Ctarget-feature=+atomics
          -Clink-args=--shared-memory
          -Clink-args=--max-memory=1073741824
          -Clink-args=--import-memory
          -Clink-args=--export=__wasm_init_tls
          -Clink-args=--export=__tls_size
          -Clink-args=--export=__tls_align
          -Clink-args=--export=__tls_base
          -Clink-args=--export=__heap_base
      run: wasm-pack test --chrome --headless --features wasm-bindgen -Z build-std=panic_abort,std

  test_msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Keep Rust 1.81 compile compatibility; run CI validation on 1.82.
    - uses: dtolnay/rust-toolchain@1.82.0
      with:
        targets: wasm32-unknown-unknown
    - name: Test MSRV
      run: |
        cargo build --features wasm-bindgen --target wasm32-unknown-unknown
        cargo build --features wasm-bindgen,sqlite3mc --target wasm32-unknown-unknown

  test_examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test Node.js example
      working-directory: examples/nodejs
      run: |
        wasm-pack build --target nodejs
        node pkg/nodejs.js
    - name: Test sqlite-vec extension
      working-directory: extensions/sqlite-vec
      run: wasm-pack test --node

  test_sqlite_wasm_vfs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Check library feature configurations without dev-dependencies
      run: |
        rustup target add wasm32-unknown-unknown
        cargo check -p sqlite-wasm-vfs --lib --target wasm32-unknown-unknown --no-default-features
        cargo check -p sqlite-wasm-vfs --lib --target wasm32-unknown-unknown --features sahpool
    - name: Test SAH pool in a dedicated worker
      working-directory: crates/sqlite-wasm-vfs
      run: wasm-pack test --chrome --headless --features sahpool

  test_vfs_native:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test rsqlite-vfs
      run: cargo test -p rsqlite-vfs
    - name: Test implement-a-vfs example
      run: cargo run -p rsqlite-vfs --example implement-a-vfs
