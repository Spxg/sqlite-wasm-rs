name: Test
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  test_bundled:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test bundled
      run: |
        wasm-pack test --node
    - name: Test use prebuild libsqlite3.a
      if: matrix.os != 'windows-latest'
      run: |
        cd examples/use-prebuild-lib
        RUSTFLAGS="-L $(pwd)" wasm-pack test --node

  test_bundled_sqlite3mc:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test bundled sqlite3mc
      run: |
        wasm-pack test --node --features sqlite3mc

  test_diesel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run diesel tests
      run: |
        git clone https://github.com/diesel-rs/diesel.git
        cd diesel
        rustup target add wasm32-unknown-unknown
        printf "[patch.crates-io]\n" >> Cargo.toml
        printf "sqlite-wasm-rs = { path = \"..\" }\n" >> Cargo.toml
        printf "rsqlite-vfs = { path = \"../crates/rsqlite-vfs\" }\n" >> Cargo.toml
        printf "sqlite-wasm-vfs = { path = \"../crates/sqlite-wasm-vfs\" }\n" >> Cargo.toml
        wasm_bindgen_version=$(cargo metadata --format-version 1 --filter-platform wasm32-unknown-unknown --no-default-features --features diesel/sqlite | jq -er '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | if length == 1 then .[0] else error("expected one wasm-bindgen version") end')
        cargo install wasm-bindgen-cli --version "$wasm_bindgen_version" --locked
        DATABASE_URL=":memory:" cargo xtask run-tests --wasm sqlite --no-example-schema-check -- --no-fail-fast

  test_rusqlite:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Run rusqlite tests
      run: |
        git clone https://github.com/rusqlite/rusqlite.git
        cd rusqlite
        printf "[patch.crates-io]\n" >> Cargo.toml
        printf "sqlite-wasm-rs = { path = \"..\" }\n" >> Cargo.toml
        printf "rsqlite-vfs = { path = \"../crates/rsqlite-vfs\" }\n" >> Cargo.toml
        printf "sqlite-wasm-vfs = { path = \"../crates/sqlite-wasm-vfs\" }\n" >> Cargo.toml
        WASM_BINDGEN_TEST_TIMEOUT=60 wasm-pack test --node --features modern-full

  test_bindgen:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test generated bindings
      run: |
        wasm-pack test --node --features bindgen
        wasm-pack test --node --features bindgen,sqlite3mc

  test_custom_host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "sqlite3mc", "bindgen", "bindgen,sqlite3mc"]
    steps:
    - uses: actions/checkout@v4
    - name: Test without wasm-bindgen
      working-directory: examples/custom-host
      run: |
        rustup target add wasm32-unknown-unknown
        cargo build --target wasm32-unknown-unknown --features '${{ matrix.features }}'
        node run.mjs
        cargo tree --target wasm32-unknown-unknown --edges normal --features '${{ matrix.features }}' > dependencies.txt
        if grep -E 'wasm-bindgen|js-sys' dependencies.txt; then
          exit 1
        fi

  test_clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check clippy
      run: |
        rustup target add wasm32-unknown-unknown
        cargo clippy --no-default-features --target wasm32-unknown-unknown -- -D warnings
        cargo clippy --all-features --target wasm32-unknown-unknown -- -D warnings

  test_implement_a_vfs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test implement-a-vfs example
      run: |
        cd examples/implement-a-vfs
        wasm-pack test --node -- -- --nocapture

  test_fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test rustfmt
      run: |
        cargo fmt --check
        cargo fmt --manifest-path examples/custom-host/Cargo.toml --check

  test_atomics:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test
      run: |
        rustup toolchain install nightly
        rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
        cd tests
        CFLAGS_wasm32_unknown_unknown='-matomics' RUSTFLAGS='-Ctarget-feature=+atomics -Clink-args=--shared-memory -Clink-args=--max-memory=1073741824 -Clink-args=--import-memory -Clink-args=--export=__wasm_init_tls -Clink-args=--export=__tls_size -Clink-args=--export=__tls_align -Clink-args=--export=__tls_base -Clink-args=--export=__heap_base' rustup run nightly wasm-pack test --chrome --headless -Z build-std=panic_abort,std

  test_msrv:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.85.0
      with:
        targets: wasm32-unknown-unknown
        components: rust-src
    - name: Test MSRV
      run: |
        cargo build --target wasm32-unknown-unknown
        cargo build --features sqlite3mc --target wasm32-unknown-unknown

  test_nodejs:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test
      run: |
        cd examples/nodejs
        wasm-pack build --target nodejs
        node pkg/nodejs.js

  test_sqlite_wasm_vec:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test
      run: |
        cd extensions/sqlite-vec
        wasm-pack test --node

  test_sqlite_wasm_vfs:
    strategy:
      matrix:
        os: [ubuntu-latest]
        features:
          - ""
          - "--no-default-features"
          - "--no-default-features --features sahpool"
          - "--all-features"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Check library without dev-dependencies
      run: |
        rustup target add wasm32-unknown-unknown
        cargo check -p sqlite-wasm-vfs --lib --target wasm32-unknown-unknown ${{ matrix.features }}
    - name: Test
      run: |
        cd crates/sqlite-wasm-vfs
        wasm-pack test --chrome --headless ${{ matrix.features }}

  test_sqlite_wasm_tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Test
      run: |
        cd tests
        wasm-pack test --chrome --headless
        wasm-pack test --chrome --headless --features sqlite3mc
        
  test_vfs_native:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          cd crates/rsqlite-vfs
          cargo test
